name: NORI CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-strip-types
      PAYLOAD_SECRET: ci-test-payload-secret-at-least-32-chars-long-for-testing
      NORI_SESSION_SECRET: ci-test-session-secret-at-least-32-chars-long-for-testing
      DATABASE_URI: file:./nori.db
      PAYMENT_MODE: MOCK
      PAYMENT_ENABLED: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10
        run: npm install -g pnpm@10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Environment Config
        run: pnpm env:check

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Static Code Lint
        run: pnpm lint

      - name: Initialize Database For Tests
        run: |
          pnpm db:migrate
          pnpm data:import --skip-backup

      - name: Run Test Suite
        run: pnpm test

      - name: Verify Database Migrations Idempotency
        run: pnpm db:check

      - name: Production Build Check
        run: pnpm build
        env:
          NODE_ENV: production
