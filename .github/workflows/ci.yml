name: NORI CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      PAYLOAD_SECRET: ci-test-payload-secret-at-least-32-chars-long-for-testing
      NORI_SESSION_SECRET: ci-test-session-secret-at-least-32-chars-long-for-testing
      DATABASE_URI: file:./nori.db
      PAYMENT_MODE: MOCK
      PAYMENT_ENABLED: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10
        run: npm install -g pnpm@10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Environment Config
        run: pnpm env:check

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Static Code Lint
        run: pnpm lint

      - name: Initialize Database For Tests
        run: |
          set +e
          echo "### Database Initialization Diagnostic" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/db-migrate.ts >> $GITHUB_STEP_SUMMARY 2>&1
          MIGRATE_EXIT=$?
          echo "db-migrate exit code: $MIGRATE_EXIT" >> $GITHUB_STEP_SUMMARY
          node scripts/data-import.ts --skip-backup >> $GITHUB_STEP_SUMMARY 2>&1
          IMPORT_EXIT=$?
          echo "data-import exit code: $IMPORT_EXIT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $MIGRATE_EXIT -ne 0 ] || [ $IMPORT_EXIT -ne 0 ]; then
            echo "Database initialization failed: migrate=$MIGRATE_EXIT, import=$IMPORT_EXIT"
            exit 1
          fi

      - name: Run Test Suite
        run: pnpm test

      - name: Verify Database Migrations Idempotency
        run: pnpm db:check

      - name: Production Build Check
        run: pnpm build
        env:
          NODE_ENV: production
