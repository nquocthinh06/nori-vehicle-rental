name: NORI CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NODE_OPTIONS: "--experimental-strip-types"
      PAYLOAD_SECRET: ci-test-payload-secret-at-least-32-chars-long-for-testing
      NORI_SESSION_SECRET: ci-test-session-secret-at-least-32-chars-long-for-testing
      DATABASE_URI: file:./nori.db
      PAYMENT_MODE: MOCK
      PAYMENT_ENABLED: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10
        run: npm install -g pnpm@10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Environment Config
        run: pnpm env:check

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Static Code Lint
        run: pnpm lint

      - name: Initialize Database For Tests
        run: |
          node scripts/init-ci.mjs 2>&1 | tee /tmp/init-db.log || {
            echo "### Database Init Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/init-db.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Test Suite
        run: |
          pnpm test 2>&1 | tee /tmp/test-suite.log || {
            echo "### Test Suite Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/test-suite.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Verify Database Migrations Idempotency
        run: |
          pnpm db:check 2>&1 | tee /tmp/db-check.log || {
            echo "### DB Check Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/db-check.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Production Build Check
        run: |
          pnpm build 2>&1 | tee /tmp/build.log || {
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          NODE_ENV: production
